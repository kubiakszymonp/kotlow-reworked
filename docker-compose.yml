version: "3.8"

services:
  frontend:
    build: 
      context: ./frontend
      args:
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_HOST: backend
      DATABASE_PORT: 1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
    networks:
      - app-network
    depends_on:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1

  backend:
    build: 
      context: ./backend
      args:
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "1337:1337"
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: ./data/data.db
      HOST: 0.0.0.0
    volumes:
      - ./backend/.env:/opt/app/.env
      - ./backend/public/uploads:/opt/app/public/uploads
      - ./backend/data:/opt/app/data
      - ./backend/exports:/opt/app/exports
      - ./backend/dist:/opt/app/dist
    networks:
      - app-network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge 