version: "3.8"

services:
  frontend:
    build: 
      context: ./frontend
      args:
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "127.0.0.1:3000:3000"  # Bind only to localhost for security
    environment:
      NODE_ENV: production
      # Used by src/lib/strapi.ts to resolve the in-network Strapi URL
      DATABASE_HOST: backend
      DATABASE_PORT: 1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
      # Secret for the Strapi webhook hitting POST /api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    networks:
      - app-network
    depends_on:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1

  backend:
    build: 
      context: ./backend
      args:
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "127.0.0.1:1337:1337"  # Bind only to localhost for security
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: ./data/data.db
      HOST: 0.0.0.0
    volumes:
      - ./backend/.env:/opt/app/.env
      - ./backend/public/uploads:/opt/app/public/uploads
      - ./backend/data:/opt/app/data
      - ./backend/exports:/opt/app/exports
      - ./backend/dist:/opt/app/dist
    networks:
      - app-network
    dns:
      - 8.8.8.8
      - 1.1.1.1



networks:
  app-network:
    driver: bridge 